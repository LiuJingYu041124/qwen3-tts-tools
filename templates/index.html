<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动中文配音</title><link rel="stylesheet" href="/static/style.css?v=auto1"></head><body>
<header><div><b>自动中文配音</b><small>上传一次，自动分析、翻译、配音、字幕、混音与质检</small></div><span id="cost">本地模型处理，不消耗云端 Token</span></header>
<main><aside><button class="primary wide" onclick="showUpload()">＋ 上传新视频</button><div id="projects"></div></aside>
<section>
<div id="empty" class="uploadHero">
  <h1>只需上传视频</h1><p>其余工作全部自动完成，无需逐步操作。</p>
  <label class="dropzone"><input id="heroVideo" type="file" accept="video/*" onchange="uploadVideo(this.files[0])"><b>选择视频并开始自动配音</b><span>MP4、MOV、MKV、WebM 等常用格式</span></label>
  <p>配音语言：<select id="heroLang"><option value="zh">中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></p>
</div>
<div id="workspace" hidden>
  <div class="title"><div><h1 id="name"></h1><p id="source"></p></div><div id="resultActions" hidden><button onclick="previewVideo()">预览成片</button><button class="primary" onclick="downloadVideo()">下载成片</button></div></div>
  <div class="autoCard"><div class="autoHead"><b id="status">等待处理</b><strong id="percent">0%</strong></div><div class="progress"><i id="progressBar"></i></div><div id="stageList" class="stageList"></div><button id="retryButton" class="danger" hidden onclick="retryAuto()">自动重试</button></div>
  <details class="panel advanced"><summary>高级功能（可选，不影响自动生成）</summary><p class="hint">只有需要人工修改台词或音色时才展开。保存修改后可以重新自动生成。</p><div class="panelhead"><h2>角色音色</h2><button onclick="addRole()">＋ 添加角色</button></div><div id="roles"></div><div class="panelhead"><h2>台词清单</h2><button onclick="saveProject()">保存高级修改</button></div><div class="tablewrap"><table><thead><tr><th>启用</th><th>#</th><th>开始</th><th>结束</th><th>角色</th><th>原文</th><th>中文台词</th><th>情绪表演</th><th></th></tr></thead><tbody id="cues"></tbody></table></div><button onclick="addCue()">＋ 添加台词</button><div id="settings" class="settings"></div></details>
  <details class="panel"><summary>运行日志</summary><pre id="log"></pre></details>
</div></section></main>
<div id="uploadModal" class="modal" hidden><div><h2>上传视频后自动配音</h2><label>选择视频<input id="modalVideo" type="file" accept="video/*"></label><label>项目名称（可选）<input id="uploadName"></label><label>配音语言<select id="uploadLang"><option value="zh">中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></label><label>配音引擎<select id="uploadEngine"><option value="gemini">Gemini 云端（多角色，情绪可控）</option><option value="local">本地 MLX（离线备用）</option></select></label><div id="uploadMessage" class="hint"></div><div class="actions"><button onclick="closeUpload()">取消</button><button class="primary" onclick="uploadVideo(document.querySelector('#modalVideo').files[0],document.querySelector('#uploadName').value)">上传并自动处理</button></div></div></div>
<div id="previewModal" class="modal" hidden><div><h2>成片预览</h2><video id="preview" controls playsinline style="width:100%;max-height:70vh;background:#000"></video><div class="actions"><button onclick="closePreview()">关闭</button></div></div></div>
<script src="/static/app.js?v=auto1"></script></body></html>
